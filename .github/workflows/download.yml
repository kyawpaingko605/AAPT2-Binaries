name: Build and Release AAPT2 Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and Extract AAPT2
        run: |
          mkdir -p output
          cd output
          
          # လုံးဝ ပွင့်တာ သေချာတဲ့ အသင့်သုံး Android SDK Build Tools (ဗားရှင်း 34.0.0) ရဲ့ Official Repository ကနေ ဆွဲခြင်း
          # ဒါက .jar မဟုတ်ဘဲ အသင့်သုံး Linux Executable ပါတဲ့ zip ဖြစ်လို့ ပိုစိတ်ချရပါတယ်
          curl -L "https://dl.google.com/android/repository/build-tools_r34-linux.zip" -o build-tools.zip
          
          # zip ကို ဖြည်ပြီး aapt2 binary ကို ဆွဲထုတ်ခြင်း
          unzip build-tools.zip "android-14/aapt2"
          
          # ရလာတဲ့ ဖိုင်အစစ်ကို ခွဲထုတ်ပြီး နာမည်ပေးခြင်း
          # (GitHub Runner က Ubuntu x86_64 ဖြစ်လို့ x86_64 ဗားရှင်းကို အရင် ရပါလိမ့်မယ်)
          mv android-14/aapt2 aapt2-x86_64
          
          # 📱 ဖုန်းအတွက် (arm64 နဲ့ arm) ဗားရှင်းတွေကို သီးသန့် စိတ်ချရတဲ့ နေရာကနေ ထပ်မံဆွဲချခြင်း
          curl -L "https://github.com/Cieco/aapt2-arm/raw/master/bin/aapt2-arm64-v8a" -o aapt2-arm64-v8a
          curl -L "https://github.com/Cieco/aapt2-arm/raw/master/bin/aapt2-armeabi-v7a" -o aapt2-armeabi-v7a
          
          # အဟောင်း x86 အတွက်ပါ တစ်ခါတည်း ဖြည့်ပေးထားခြင်း
          curl -L "https://github.com/Cieco/aapt2-arm/raw/master/bin/aapt2-x86" -o aapt2-x86
          
          # Permission ပေးခြင်း
          chmod +x aapt2-*
          
          # သန့်ရှင်းရေးလုပ်ခြင်း
          rm -rf android-14 build-tools.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AAPT2 Up-to-date Binaries
          files: output/aapt2-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
