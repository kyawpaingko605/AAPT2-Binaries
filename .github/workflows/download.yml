name: Build and Release AAPT2 Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Google Official AAPT2 Binaries
        run: |
          mkdir -p output
          cd output
          
          # Google ရဲ့ တရားဝင် AOSP (Android Open Source Project) Prebuilts Git ထဲကနေ 
          # စိတ်ချရဆုံးနဲ့ အသစ်ဆုံး သန့်သန့်ရှင်းရှင်း Executable Binary အစစ်တွေကို တိုက်ရိုက်ဆွဲချခြင်း
          
          # 1. arm64-v8a အတွက်
          curl -L "https://android.googlesource.com/platform/prebuilts/sdk/+/refs/heads/main/tools/linux/aapt2?format=TEXT" | base64 -d > aapt2-arm64-v8a
          
          # 2. armeabi-v7a အတွက်
          curl -L "https://android.googlesource.com/platform/prebuilts/sdk/+/refs/heads/main/tools/linux/aapt2?format=TEXT" | base64 -d > aapt2-armeabi-v7a
          
          # 3. x86_64 အတွက်
          curl -L "https://android.googlesource.com/platform/prebuilts/sdk/+/refs/heads/main/tools/linux/aapt2?format=TEXT" | base64 -d > aapt2-x86_64
          
          # 4. x86 အတွက်
          curl -L "https://android.googlesource.com/platform/prebuilts/sdk/+/refs/heads/main/tools/windows/aapt2.exe?format=TEXT" | base64 -d > aapt2-x86

          # ဇစ်ဖြည်စရာမလိုဘဲ binary အစစ် တန်းထွက်လာလို့ Permission ပဲ ပေးလိုက်ရုံပါပဲ
          chmod +x aapt2-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AAPT2 Google Official Binaries
          files: output/aapt2-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
