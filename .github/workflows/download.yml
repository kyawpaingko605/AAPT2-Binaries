name: Build and Release AAPT2 Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Google Android AAPT2 Binaries
        run: |
          mkdir -p output
          cd output
          
          # Google Official Maven Repository ကနေ လုံးဝ (လုံးဝ) HTML မပါတဲ့ Binary သန့်သန့်တွေကို တိုက်ရိုက်ဆွဲချခြင်း
          VERSION="8.3.0-alpha14-11103099"
          URL="https://repo1.maven.org/maven2/com/android/tools/build/aapt2/$VERSION"
          
          # 1. arm64-v8a အတွက် ဒေါင်းပြီး ဇစ်ဖြည်ကာ binary သီးသန့်ထုတ်ယူခြင်း
          wget "$URL/aapt2-$VERSION-linux-arm64.jar"
          unzip -p "aapt2-$VERSION-linux-arm64.jar" aapt2 > aapt2-arm64-v8a
          
          # 2. armeabi-v7a အတွက်
          wget "$URL/aapt2-$VERSION-linux-arm.jar"
          unzip -p "aapt2-$VERSION-linux-arm.jar" aapt2 > aapt2-armeabi-v7a
          
          # 3. x86_64 အတွက်
          wget "$URL/aapt2-$VERSION-linux-x86_64.jar"
          unzip -p "aapt2-$VERSION-linux-x86_64.jar" aapt2 > aapt2-x86_64
          
          # 4. x86 အတွက်
          wget "$URL/aapt2-$VERSION-windows-x86.jar"
          unzip -p "aapt2-$VERSION-windows-x86.jar" aapt2.exe > aapt2-x86
          
          # သန့်ရှင်းရေးလုပ်ပြီး Execute လုပ်ခွင့် Permission ပေးခြင်း
          rm -f *.jar
          chmod +x aapt2-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AAPT2 Official Binaries
          files: output/aapt2-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
