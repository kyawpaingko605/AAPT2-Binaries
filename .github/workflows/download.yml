name: Build and Release AAPT2 Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Stable AAPT2 Binaries
        run: |
          mkdir -p output
          cd output
          
          # သန့်ရှင်းတဲ့ နေရာကနေ Binary ဖိုင်တွေကို တိုက်ရိုက်ဆွဲချခြင်း
          curl -L "https://github.com/Cieco/aapt2-arm/raw/master/bin/aapt2-arm64-v8a" -o aapt2-arm64-v8a
          curl -L "https://github.com/Cieco/aapt2-arm/raw/master/bin/aapt2-armeabi-v7a" -o aapt2-armeabi-v7a
          curl -L "https://github.com/Cieco/aapt2-arm/raw/master/bin/aapt2-x86_64" -o aapt2-x86_64
          curl -L "https://github.com/Cieco/aapt2-arm/raw/master/bin/aapt2-x86" -o aapt2-x86

          # Permission ပေးခြင်း
          chmod +x aapt2-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AAPT2 Stable Binaries
          files: output/aapt2-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
